<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="wzGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="wzGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="wzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#wzGrad1)" filter="url(#wzGlow)" />
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#0f172a" fill-opacity="0.1" />

  <!-- Modern Connected 'W' Zen Stroke -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Wing -->
    <path d="M26 34 L38 68 L50 44 L62 68 L74 34" stroke="#ffffff" stroke-width="7.5" />
    <!-- Ambient Zen Pulse Loop -->
    <path d="M38 68 C44 76, 56 76, 62 68" stroke="url(#wzGrad2)" stroke-width="5" />
  </g>

  <!-- People/Zen Accent Nodes -->
  <circle cx="26" cy="30" r="4.5" fill="#38bdf8" />
  <circle cx="50" cy="40" r="4.5" fill="#c084fc" />
  <circle cx="74" cy="30" r="4.5" fill="#38bdf8" />
