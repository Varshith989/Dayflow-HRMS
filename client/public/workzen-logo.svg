<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="wzLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="wzPulse" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="wzLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#wzLogoGrad)" filter="url(#wzLogoGlow)" />
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 22 L23 44 L30 29 L37 44 L45 22" stroke="#ffffff" stroke-width="4.5" />
      <path d="M23 44 C27 49, 33 49, 37 44" stroke="url(#wzPulse)" stroke-width="3.2" />
    </g>
    <circle cx="15" cy="19" r="2.8" fill="#38bdf8" />
    <circle cx="30" cy="26" r="2.8" fill="#c084fc" />
    <circle cx="45" cy="19" r="2.8" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <!-- "Work" -->
  <text x="82" y="44" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-weight="800" font-size="28" fill="#0f172a" letter-spacing="-0.5">
    Work<tspan fill="#6366f1">Zen</tspan>
  </text>

  <!-- "HRMS" Pill Badge -->
  <g transform="translate(225, 23)">
    <rect x="0" y="0" width="48" height="22" rx="6" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.3" />
    <text x="24" y="15" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" font-weight="700" font-size="10" fill="#6366f1" letter-spacing="0.5">
      HRMS
    </text>
  </g>

  <!-- Tagline -->
  <text x="83" y="60" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="11" fill="#64748b" letter-spacing="0.2">
    Work smarter. Stay in sync.
  </text>
</svg>
